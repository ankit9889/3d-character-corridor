<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Character Walk Studio</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b0f19; font-family: system-ui, -apple-system, sans-serif; color: #fff; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }

        #top-bar { position: absolute; top: 20px; right: 20px; display: flex; gap: 12px; z-index: 10; align-items: center; }
        .btn {
            background: rgba(20, 24, 33, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff; padding: 10px 18px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13px;
            transition: all 0.2s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 8px;
        }
        .btn:hover { background: rgba(35, 41, 56, 0.95); border-color: rgba(255, 255, 255, 0.25); transform: translateY(-1px); }
        .btn-primary { background: linear-gradient(135deg, #e62e2e 0%, #b31414 100%); border-color: rgba(255, 255, 255, 0.2); }

        #status-badge {
            position: absolute; top: 20px; left: 20px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px 16px; border-radius: 10px; font-size: 12px; z-index: 10;
            display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .status-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; }

        #control-panel {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 960px;
            background: rgba(13, 17, 26, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px; padding: 18px 24px; z-index: 10; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; align-items: center; box-sizing: border-box;
        }
        @media (max-width: 850px) { #control-panel { grid-template-columns: 1fr 1fr; } }

        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .control-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #94a3b8; font-weight: 700; display: flex; justify-content: space-between; }

        .segmented-control { display: flex; background: rgba(0, 0, 0, 0.4); border-radius: 8px; padding: 3px; border: 1px solid rgba(255,255,255,0.06); }
        .seg-btn {
            flex: 1; background: transparent; border: none; color: #94a3b8; padding: 6px 10px; font-size: 11px;
            font-weight: 600; border-radius: 6px; cursor: pointer; transition: all 0.2s; text-align: center;
        }
        .seg-btn.active { background: #e62e2e; color: #fff; box-shadow: 0 2px 10px rgba(230, 46, 46, 0.4); }

        .slider-container { display: flex; align-items: center; gap: 10px; }
        input[type=range] { flex: 1; -webkit-appearance: none; background: rgba(255, 255, 255, 0.1); height: 6px; border-radius: 3px; outline: none; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px; background: #e62e2e; border-radius: 50%; box-shadow: 0 0 8px rgba(230,46,46,0.8); cursor: pointer;
        }
        .slider-value { font-size: 12px; font-weight: 600; color: #f8fafc; min-width: 32px; text-align: right; }
        #file-input { display: none; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/meshopt_decoder.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="status-badge">
        <div class="status-dot"></div>
        <span id="status-text">Studio Ready • Drag & Drop .GLB File</span>
    </div>

    <div id="top-bar">
        <button class="btn" id="btn-default">Default Character</button>
        <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
            Load .GLB File
        </button>
        <input type="file" id="file-input" accept=".glb,.gltf">
    </div>

    <div id="canvas-container"></div>

    <div id="control-panel">
        <div class="control-group">
            <span class="control-label">Animation Mode</span>
            <div class="segmented-control" id="mode-control">
                <button class="seg-btn active" data-mode="walk">Walk</button>
                <button class="seg-btn" data-mode="lay">Rest Pose</button>
                <button class="seg-btn" data-mode="talk">AI Talk</button>
                <button class="seg-btn" data-mode="idle">Idle</button>
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">Speed <span class="slider-value" id="val-speed">1.0x</span></span>
            <div class="slider-container">
                <input type="range" id="slider-speed" min="0.1" max="2.0" step="0.05" value="1.0">
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">Motion Intensity <span class="slider-value" id="val-limb">1.0x</span></span>
            <div class="slider-container">
                <input type="range" id="slider-limb" min="0.0" max="2.0" step="0.05" value="1.0">
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">Color / Style</span>
            <div class="segmented-control" id="material-control">
                <button class="seg-btn active" data-mat="pbr">Textured</button>
                <button class="seg-btn" data-mat="clay">Clay</button>
                <button class="seg-btn" data-mat="wire">Wire</button>
            </div>
        </div>
    </div>

    <script>
        // ------------------------------------------------------------------
        // Scene
        // ------------------------------------------------------------------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0f19);
        scene.fog = new THREE.FogExp2(0x0b0f19, 0.06);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.0, 3.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0.85, 0);
        controls.maxPolarAngle = Math.PI / 2 + 0.05;
        controls.minDistance = 0.8;
        controls.maxDistance = 8;

        const hemiLight = new THREE.HemisphereLight(0xdfe8ff, 0x1a1d26, 0.9);
        scene.add(hemiLight);
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.25);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff3e6, 2.2);
        dirLight.position.set(2.5, 5, 4);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(2048, 2048);
        dirLight.shadow.camera.left = -2; dirLight.shadow.camera.right = 2;
        dirLight.shadow.camera.top = 3; dirLight.shadow.camera.bottom = -1;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        const rimLight = new THREE.DirectionalLight(0x8fb4ff, 0.9);
        rimLight.position.set(-4, 3, -3);
        scene.add(rimLight);

        // Baked-light textures need neutral, ~1:1 lighting; clay/flat colors look better with studio lighting
        function setLightingProfile(textured) {
            if (textured) {
                renderer.toneMapping = THREE.NoToneMapping;
                hemiLight.intensity = 0.28; ambientLight.intensity = 0.06;
                dirLight.intensity = 0.42; rimLight.intensity = 0.3;
            } else {
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                hemiLight.intensity = 0.9; ambientLight.intensity = 0.25;
                dirLight.intensity = 2.2; rimLight.intensity = 0.9;
            }
            scene.traverse(o => { if (o.material) o.material.needsUpdate = true; });
        }

        // Ground: grid scrolls under the feet while walking (treadmill effect)
        const GRID_SIZE = 16, GRID_DIV = 24, GRID_CELL = GRID_SIZE / GRID_DIV;
        const gridHelper = new THREE.GridHelper(GRID_SIZE, GRID_DIV, 0x33415e, 0x1e293b);
        gridHelper.position.y = 0.001;
        scene.add(gridHelper);

        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(40, 40),
            new THREE.MeshStandardMaterial({ color: 0x0a0e17, roughness: 0.9, metalness: 0.1 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        let currentModel = null;   // THREE.Object3D in scene
        let rig = null;            // auto-rig data when a GLB is loaded
        const clock = new THREE.Clock();
        const state = { mode: 'walk', speed: 1.0, limbIntensity: 1.0, materialMode: 'pbr' };

        // ------------------------------------------------------------------
        // Reference colors (from Meshy_AI_character_front/back_view.png)
        // ------------------------------------------------------------------
        const C = {};
        const PALETTE = {
            skin: 0xf0a585, ear: 0xec9476, nose: 0xe8806c, tattoo: 0x3b2a26,
            beard: 0xe9e5de, brow: 0x5a3622, frame: 0x121214, gold: 0xd4a43c,
            hairBase: 0x7a4024, hairGrey: 0xcfc6bb, hairCrimson: 0xb81f3c, hairRed: 0xe2352a,
            hairOrange: 0xf0862a, hairYellow: 0xf7c447,
            jacket: 0xc9222a, jacketRib: 0xa81b22, tee: 0x17171a, zip: 0xb89448,
            pants: 0x1d1c20, pantsCuff: 0x29282d, sockY: 0xf2c230, sockB: 0x3a6cc8, sockR: 0xd8413a,
            shoe: 0x19191c, sole: 0xece5d6, lace: 0xf1eee8, watch: 0x101012,
        };
        for (const k in PALETTE) C[k] = new THREE.Color(PALETTE[k]).convertSRGBToLinear();

        const tmpCol = new THREE.Color();
        const clamp01 = (v) => Math.max(0, Math.min(1, v));
        const smooth = (a, b, v) => { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };
        const hash = (x, y, z) => { const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return s - Math.floor(s); };
        const tattooAt = (x, y, z) => Math.sin(x * 95 + Math.sin(y * 70) * 2.2) * Math.sin(y * 115 + z * 60 + Math.sin(x * 40)) > 0.5;

        // x,y,z are "native" coordinates: height spans y = -1 (soles) .. +1 (hair tip), +z = front, +x = character's left
        function referenceColor(x, y, z, out) {
            const ax = Math.abs(x);
            let c;
            if (y < -0.80) {                                   // shoes
                if (y < -0.935) c = C.sole;
                else if (y > -0.885 && z > 0.06 && Math.abs(ax - 0.15) < 0.028) c = C.lace;
                else c = C.shoe;
            } else if (y < -0.715) {                           // striped socks
                c = [C.sockY, C.sockB, C.sockR][Math.floor((-0.715 - y) / 0.017) % 3];
            } else if (y < 0.04 && y > -0.42 && ax > 0.222) {  // forearms + hands
                if (x > 0 && y > -0.125 && y < -0.072) c = C.watch;
                else if (y > -0.075 && tattooAt(x, y, z)) c = C.tattoo;
                else c = C.skin;
            } else {
                const hem = -0.075 - 0.035 * smooth(0.05, -0.08, z);  // jacket hem lower at the back
                if (y < hem) {                                  // pants
                    c = y < -0.64 ? C.pantsCuff : C.pants;
                } else if (y < 0.345 || (y < 0.42 && ax > 0.095) || (y < 0.405 && z < 0.03)) {   // jacket
                    if (z > 0.04 && ax < 0.088 && y < 0.345) {
                        c = (x > -0.04 && x < 0.004 && y > 0.15 && y < 0.215) ? C.gold : C.tee;
                    } else if (z > 0.04 && ax < 0.102 && y < 0.345) c = C.zip;
                    else if (y < hem + 0.045 || (ax > 0.215 && y < 0.095) || (y > 0.335 && ax < 0.095 && z < 0.04)) c = C.jacketRib;
                    else if (y > 0.335 && ax < 0.095) c = C.tee;
                    else c = C.jacket;
                } else if (y > 0.35 && y < 0.60 && ax < 0.08 && z > (y < 0.47 ? 0.13 : 0.10)) {
                    c = C.beard;
                } else if (y > 0.43 && y < 0.55 && ax > 0.12) {
                    c = C.gold;                                 // hoop earrings
                } else if (y < 0.47) {
                    c = tattooAt(x, y, z) ? C.tattoo : C.skin;  // tattooed neck
                } else if (y > 0.585 && y < 0.70 && ax < 0.04 && z > 0.16) {
                    c = C.nose;
                } else if (y > 0.67 && y < 0.73 && z > 0.14) {
                    c = C.frame;                                // glasses
                } else if (y > 0.585 && y < 0.665 && ax < 0.045 && z > 0.165) {
                    c = C.nose;
                } else if (y > 0.728 && y < 0.758 && z > 0.10 && ax > 0.015 && ax < 0.12) {
                    c = C.brow;
                } else if (y > 0.80 || (y > 0.785 && z > -0.02)) {
                    // colourful mohawk: brown roots -> crimson / red / orange / yellow tips
                    const t = Math.pow(clamp01((y - 0.78) / 0.18), 0.8);
                    const s = clamp01((x + 0.12) / 0.24);
                    if (s < 0.35) tmpCol.copy(C.hairCrimson).lerp(C.hairRed, s / 0.35);
                    else if (s < 0.7) tmpCol.copy(C.hairRed).lerp(C.hairOrange, (s - 0.35) / 0.35);
                    else tmpCol.copy(C.hairOrange).lerp(C.hairYellow, (s - 0.7) / 0.3);
                    const back = z < -0.08 ? 0.55 : 1.0;
                    out.copy(C.hairBase).lerp(tmpCol, t * back);
                    return jitter(out, x, y, z, 0.08);
                } else if (z < -0.05 && y > 0.52 && ax < 0.135) {
                    c = y > 0.76 ? C.hairBase : C.hairGrey;     // back of head: grey undercut
                } else if (y > 0.68 && ax > 0.10 && z < 0.06) {
                    c = C.hairGrey;                             // grey sides
                } else if (ax > 0.13 && y < 0.69) {
                    c = C.ear;
                } else {
                    c = C.skin;
                }
            }
            out.copy(c);
            return jitter(out, x, y, z, 0.05);
        }
        function jitter(col, x, y, z, amt) {
            const f = 1 + (hash(x, y, z) - 0.5) * amt;
            col.r *= f; col.g *= f; col.b *= f;
            return col;
        }

        // ------------------------------------------------------------------
        // Auto-rig: skeleton layout in native coordinates (measured from the model)
        // ------------------------------------------------------------------
        const JOINTS = [
            // name, parent, x, y, z   (x for left side; right side mirrored)
            ['hips',       null,     0.000, -0.20,  0.01],
            ['spine',      'hips',   0.000, -0.02,  0.01],
            ['chest',      'spine',  0.000,  0.20,  0.00],
            ['neck',       'chest',  0.000,  0.40, -0.02],
            ['head',       'neck',   0.000,  0.48,  0.00],
            ['upperArm_L', 'chest',  0.180,  0.30, -0.05],
            ['foreArm_L',  'upperArm_L', 0.275, 0.07, -0.06],
            ['hand_L',     'foreArm_L',  0.335, -0.10, 0.00],
            ['upperArm_R', 'chest', -0.180,  0.30, -0.05],
            ['foreArm_R',  'upperArm_R', -0.275, 0.07, -0.06],
            ['hand_R',     'foreArm_R', -0.335, -0.10, 0.00],
            ['thigh_L',    'hips',   0.105, -0.20,  0.01],
            ['shin_L',     'thigh_L', 0.120, -0.48, -0.02],
            ['foot_L',     'shin_L',  0.135, -0.81, -0.04],
            ['thigh_R',    'hips',  -0.105, -0.20,  0.01],
            ['shin_R',     'thigh_R', -0.120, -0.48, -0.02],
            ['foot_R',     'shin_R', -0.135, -0.81, -0.04],
        ];
        const JI = {}; JOINTS.forEach((j, i) => JI[j[0]] = i);
        const jp = (name) => { const j = JOINTS[JI[name]]; return [j[2], j[3], j[4]]; };

        // capsule segments used for skin weights: [bone, start, end, radius, kind, side]
        const SEGMENTS = [
            ['hips',  jp('hips'),  jp('spine'), 0.17, 'torso', 0],
            ['spine', jp('spine'), jp('chest'), 0.19, 'torso', 0],
            ['chest', jp('chest'), jp('neck'),  0.18, 'torso', 0],
            ['neck',  jp('neck'),  jp('head'),  0.07, 'torso', 0],
            ['head',  jp('head'),  [0, 0.90, 0], 0.20, 'head', 0],
        ];
        for (const [s, side] of [['L', 1], ['R', -1]]) {
            SEGMENTS.push(
                ['upperArm_' + s, jp('upperArm_' + s), jp('foreArm_' + s), 0.065, 'arm', side],
                ['foreArm_' + s,  jp('foreArm_' + s),  jp('hand_' + s),    0.055, 'arm', side],
                ['hand_' + s,     jp('hand_' + s),     [0.34 * side, -0.30, 0.05], 0.055, 'arm', side],
                ['thigh_' + s,    jp('thigh_' + s),    jp('shin_' + s),    0.095, 'leg', side],
                ['shin_' + s,     jp('shin_' + s),     jp('foot_' + s),    0.075, 'leg', side],
                ['foot_' + s,     jp('foot_' + s),     [0.15 * side, -0.95, 0.15], 0.085, 'leg', side],
            );
        }
        SEGMENTS.forEach(s => s[0] = JI[s[0]]);

        function segDist(px, py, pz, a, b) {
            const abx = b[0] - a[0], aby = b[1] - a[1], abz = b[2] - a[2];
            const apx = px - a[0], apy = py - a[1], apz = pz - a[2];
            const t = clamp01((apx * abx + apy * aby + apz * abz) / (abx * abx + aby * aby + abz * abz));
            const dx = apx - abx * t, dy = apy - aby * t, dz = apz - abz * t;
            return Math.sqrt(dx * dx + dy * dy + dz * dz);
        }

        function computeSkin(x, y, z, outIdx, outW, o) {
            const ax = Math.abs(x), side = x >= 0 ? 1 : -1, sfx = side > 0 ? '_L' : '_R';
            const single = (name) => { outIdx[o] = JI[name]; outW[o] = 1; outIdx[o+1] = outIdx[o+2] = outIdx[o+3] = 0; outW[o+1] = outW[o+2] = outW[o+3] = 0; };

            if (y > 0.50 || (y > 0.35 && z > 0.13 && ax < 0.10) || (y > 0.42 && y < 0.56 && ax > 0.115)) return single('head');
            if (y < -0.86) return single('foot' + sfx);

            const bi = [0, 0, 0, 0], bw = [0, 0, 0, 0];
            for (let s = 0; s < SEGMENTS.length; s++) {
                const [bone, a, b, r, kind, sd] = SEGMENTS[s];
                let gate = 1;
                if (kind === 'arm') { if (sd * x < 0.10 || y > 0.42) continue; }
                else if (kind === 'leg') { if (sd * x < -0.03 || y > 0.0) continue; gate = smooth(-0.03, 0.03, sd * x); }
                else if (kind === 'head') { if (y < 0.36) continue; }
                const e = segDist(x, y, z, a, b) / r;
                const w = gate / Math.pow(e + 0.15, 6);
                // insert into top-4
                for (let k = 0; k < 4; k++) {
                    if (w > bw[k]) {
                        for (let m = 3; m > k; m--) { bw[m] = bw[m-1]; bi[m] = bi[m-1]; }
                        bw[k] = w; bi[k] = bone; break;
                    }
                }
            }
            const sum = bw[0] + bw[1] + bw[2] + bw[3] || 1;
            for (let k = 0; k < 4; k++) { outIdx[o+k] = bi[k]; outW[o+k] = bw[k] / sum; }
        }

        // Copy geometry into plain float attributes with the mesh's world transform baked in
        function bakeGeometry(mesh) {
            const src = mesh.geometry;
            const g = new THREE.BufferGeometry();
            const getters = ['getX', 'getY', 'getZ', 'getW'];
            const toFloat = (attr) => {
                const n = attr.count, k = attr.itemSize, out = new Float32Array(n * k);
                const arr = attr.isInterleavedBufferAttribute ? attr.data.array : attr.array;
                let div = 1;
                if (attr.normalized) {
                    if (arr instanceof Int8Array) div = 127; else if (arr instanceof Uint8Array) div = 255;
                    else if (arr instanceof Int16Array) div = 32767; else if (arr instanceof Uint16Array) div = 65535;
                }
                for (let i = 0; i < n; i++) for (let c = 0; c < k; c++) {
                    let v = attr[getters[c]](i);
                    if (div !== 1) v = Math.max(v / div, -1);
                    out[i * k + c] = v;
                }
                return new THREE.BufferAttribute(out, k);
            };
            g.setAttribute('position', toFloat(src.attributes.position));
            if (src.attributes.normal) g.setAttribute('normal', toFloat(src.attributes.normal));
            if (src.attributes.uv) g.setAttribute('uv', toFloat(src.attributes.uv));
            if (src.attributes.color) g.setAttribute('color', toFloat(src.attributes.color));
            if (src.index) g.setIndex(new THREE.BufferAttribute(src.index.array.slice(), 1));
            g.applyMatrix4(mesh.matrixWorld);
            if (!g.attributes.normal) g.computeVertexNormals();
            return g;
        }

        function buildRiggedCharacter(gltfScene) {
            gltfScene.updateMatrixWorld(true);
            const parts = [];
            gltfScene.traverse((ch) => { if (ch.isMesh) parts.push({ geo: bakeGeometry(ch), mat: ch.material }); });

            const bbox = new THREE.Box3();
            parts.forEach(p => { p.geo.computeBoundingBox(); bbox.union(p.geo.boundingBox); });
            const H = bbox.max.y - bbox.min.y, s = H / 2;
            const cx = (bbox.min.x + bbox.max.x) / 2, cz = (bbox.min.z + bbox.max.z) / 2, y0 = bbox.min.y;
            const fromNative = (n) => new THREE.Vector3(cx + n[0] * s, y0 + (n[1] + 1) * s, cz + n[2] * s);

            // bones
            const bones = JOINTS.map(j => { const b = new THREE.Bone(); b.name = j[0]; return b; });
            JOINTS.forEach((j, i) => {
                const pos = fromNative([j[2], j[3], j[4]]);
                if (j[1]) {
                    const parentPos = fromNative(jp(j[1]));
                    bones[i].position.copy(pos.sub(parentPos));
                    bones[JI[j[1]]].add(bones[i]);
                } else bones[i].position.copy(pos);
            });

            const group = new THREE.Group();
            group.add(bones[0]);
            group.updateMatrixWorld(true);
            const skeleton = new THREE.Skeleton(bones);

            const meshes = [];
            let colored = false;
            parts.forEach(({ geo, mat }) => {
                const pos = geo.attributes.position, n = pos.count;
                const skinIdx = new Uint16Array(n * 4), skinW = new Float32Array(n * 4);
                const needColors = !(mat && mat.map) && !geo.attributes.color;
                const colors = needColors ? new Float32Array(n * 3) : null;
                const col = new THREE.Color();
                for (let i = 0; i < n; i++) {
                    const x = (pos.getX(i) - cx) / s, y = (pos.getY(i) - y0) / s - 1, z = (pos.getZ(i) - cz) / s;
                    computeSkin(x, y, z, skinIdx, skinW, i * 4);
                    if (colors) { referenceColor(x, y, z, col); colors[i*3] = col.r; colors[i*3+1] = col.g; colors[i*3+2] = col.b; }
                }
                geo.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinIdx, 4));
                geo.setAttribute('skinWeight', new THREE.Float32BufferAttribute(skinW, 4));

                let material;
                if (colors) {
                    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                    material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.72, metalness: 0.0, skinning: true });
                    colored = true;
                } else {
                    material = (mat || new THREE.MeshStandardMaterial()).clone();
                    material.skinning = true;
                    if (geo.attributes.color && !mat.map) material.vertexColors = true;
                    if (material.map) {
                        // reference-projected textures already contain studio lighting:
                        // lift them so the scene lights don't double-darken them
                        material.emissive = new THREE.Color(0xffffff);
                        material.emissiveMap = material.map;
                        material.emissiveIntensity = 0.45;
                        material.roughness = 0.85;
                        material.metalness = 0.0;
                        material.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
                    }
                }
                const sm = new THREE.SkinnedMesh(geo, material);
                sm.castShadow = sm.receiveShadow = true;
                sm.frustumCulled = false;
                sm.userData.origMaterial = material;
                group.add(sm);
                sm.bind(skeleton);
                meshes.push(sm);
            });

            const b = {}; bones.forEach(bn => b[bn.name] = bn);
            const rest = {}; bones.forEach(bn => rest[bn.name] = bn.position.clone());

            // leg vectors (native) for foot grounding
            const sub = (a, c) => [a[0] - c[0], a[1] - c[1], a[2] - c[2]];
            const legs = {
                L: { v1: sub(jp('shin_L'), jp('thigh_L')), v2: sub(jp('foot_L'), jp('shin_L')), prevZ: null },
                R: { v1: sub(jp('shin_R'), jp('thigh_R')), v2: sub(jp('foot_R'), jp('shin_R')), prevZ: null },
            };
            return { group, bones: b, rest, meshes, s, H, bbox, cx, cz, legs, colored, groundSpeed: 0 };
        }

        // ------------------------------------------------------------------
        // Materials
        // ------------------------------------------------------------------
        function updateModelMaterials(obj) {
            obj.traverse((child) => {
                if (!child.isMesh) return;
                child.castShadow = child.receiveShadow = true;
                if (!child.userData.origMaterial) child.userData.origMaterial = child.material;
                const skinning = !!child.isSkinnedMesh;
                if (state.materialMode === 'wire') {
                    child.material = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, skinning });
                } else if (state.materialMode === 'clay') {
                    child.material = new THREE.MeshStandardMaterial({ color: 0xdfe3ea, roughness: 0.55, skinning });
                } else {
                    child.material = child.userData.origMaterial;
                }
            });
        }

        // ------------------------------------------------------------------
        // Default placeholder avatar
        // ------------------------------------------------------------------
        function createDefaultAvatar() {
            if (currentModel) scene.remove(currentModel);
            rig = null;
            const group = new THREE.Group();
            const mat = (c) => new THREE.MeshStandardMaterial({ color: new THREE.Color(c).convertSRGBToLinear(), roughness: 0.7 });
            const jacket = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.25, 0.7, 16), mat(0xc9222a));
            jacket.position.set(0, 0.95, 0); group.add(jacket);
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.07, 0.7, 12), mat(0x1d1c20));
            leg.position.set(-0.11, 0.38, 0); group.add(leg);
            const leg2 = leg.clone(); leg2.position.x = 0.11; group.add(leg2);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), mat(0xf0a585));
            head.position.set(0, 1.5, 0); group.add(head);
            currentModel = group;
            updateModelMaterials(currentModel);
            scene.add(currentModel);
            setLightingProfile(false);
            document.getElementById('status-text').innerText = "Default Character Loaded";
        }
        createDefaultAvatar();

        // ------------------------------------------------------------------
        // GLB loading
        // ------------------------------------------------------------------
        const gltfLoader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
        gltfLoader.setDRACOLoader(dracoLoader);
        if (typeof MeshoptDecoder !== 'undefined') gltfLoader.setMeshoptDecoder(MeshoptDecoder);

        function loadGLBFile(fileOrUrl) {
            const url = typeof fileOrUrl === 'string' ? fileOrUrl : URL.createObjectURL(fileOrUrl);
            document.getElementById('status-text').innerText = "Loading, rigging & coloring model...";

            gltfLoader.load(url, (gltf) => {
                // let the status text paint before the heavy rigging step
                setTimeout(() => {
                    try {
                        const r = buildRiggedCharacter(gltf.scene);
                        if (currentModel) scene.remove(currentModel);
                        rig = r;
                        const sf = 1.75 / r.H;
                        r.scale = sf;
                        r.group.scale.setScalar(sf);
                        r.group.position.set(-r.cx * sf, -r.bbox.min.y * sf, -r.cz * sf);
                        currentModel = r.group;
                        updateModelMaterials(currentModel);
                        scene.add(currentModel);
                        setLightingProfile(!r.colored && state.materialMode === 'pbr');

                        camera.position.set(0, 1.0, 3.4);
                        controls.target.set(0, 0.85, 0);
                        controls.update();

                        const how = r.colored ? 'flat colors (load character_textured.glb for the real look)' : 'reference textures';
                        document.getElementById('status-text').innerText = `Model rigged • ${how}`;
                    } catch (e) {
                        console.error(e);
                        document.getElementById('status-text').innerText = "Rigging failed: " + e.message;
                    }
                }, 30);
            }, undefined, (err) => {
                console.error(err);
                document.getElementById('status-text').innerText = "Error Loading File";
            });
        }

        document.getElementById('file-input').addEventListener('change', (e) => {
            if (e.target.files.length > 0) loadGLBFile(e.target.files[0]);
        });
        document.getElementById('btn-default').addEventListener('click', createDefaultAvatar);
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length > 0) loadGLBFile(e.dataTransfer.files[0]);
        });

        // ------------------------------------------------------------------
        // UI
        // ------------------------------------------------------------------
        document.querySelectorAll('#mode-control .seg-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#mode-control .seg-btn').forEach(b => b.classList.remove('active'));
                e.currentTarget.classList.add('active');
                state.mode = e.currentTarget.getAttribute('data-mode');
            });
        });
        document.querySelectorAll('#material-control .seg-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#material-control .seg-btn').forEach(b => b.classList.remove('active'));
                e.currentTarget.classList.add('active');
                state.materialMode = e.currentTarget.getAttribute('data-mat');
                if (currentModel) updateModelMaterials(currentModel);
                setLightingProfile(!!rig && !rig.colored && state.materialMode === 'pbr');
            });
        });
        document.getElementById('slider-speed').addEventListener('input', (e) => {
            state.speed = parseFloat(e.target.value);
            document.getElementById('val-speed').innerText = state.speed.toFixed(1) + 'x';
        });
        document.getElementById('slider-limb').addEventListener('input', (e) => {
            state.limbIntensity = parseFloat(e.target.value);
            document.getElementById('val-limb').innerText = state.limbIntensity.toFixed(1) + 'x';
        });

        // ------------------------------------------------------------------
        // Procedural animation
        // ------------------------------------------------------------------
        let walkPhase = 0, time = 0, groundOffset = 0;
        const BONE_NAMES = JOINTS.map(j => j[0]);

        function poseTargets(mode, k, p, t) {
            const T = {}; BONE_NAMES.forEach(n => T[n] = [0, 0, 0]);
            const hipsOff = [0, 0, 0];
            const sin = Math.sin, cos = Math.cos, max = Math.max;

            if (mode === 'walk') {
                const A = Math.min(0.75, 0.40 * k);            // thigh swing
                const armA = Math.min(0.7, 0.30 * k);
                for (const [s, q] of [['L', p], ['R', p + Math.PI]]) {
                    const thigh = -A * sin(q) - 0.04;
                    const knee = 0.08 + Math.min(1.3, 0.95 * k) * Math.pow(max(0, cos(q + 0.35)), 2)
                               + 0.10 * k * Math.pow(max(0, sin(q - Math.PI / 2)), 2);       // loading-response flex
                    const toeOff = 0.38 * k * max(0, -sin(q)) * max(0, -cos(q)) * 2;
                    const heelStrike = -0.22 * k * Math.pow(max(0, sin(q)), 3);
                    T['thigh_' + s] = [thigh, 0, 0];
                    T['shin_' + s] = [knee, 0, 0];
                    T['foot_' + s] = [-(thigh + knee) + toeOff * 0.6 + heelStrike, 0, 0];
                }
                // arms swing opposite to legs, elbows bend more when the arm swings forward
                T.upperArm_L = [armA * sin(p), 0, -0.10];
                T.upperArm_R = [-armA * sin(p), 0, 0.10];
                T.foreArm_L = [-(0.18 + 0.30 * k * max(0, -sin(p))), 0, 0];
                T.foreArm_R = [-(0.18 + 0.30 * k * max(0, sin(p))), 0, 0];
                T.hand_L = [-0.08, 0, 0]; T.hand_R = [-0.08, 0, 0];
                // pelvis twist, counter-rotating shoulders, steady head
                T.hips = [0, -0.07 * k * sin(p), 0.03 * k * sin(2 * p)];
                T.spine = [0.05, 0.08 * k * sin(p), -0.02 * k * sin(2 * p)];
                T.chest = [0.02 + 0.015 * cos(2 * p), 0.07 * k * sin(p), -0.01 * k * sin(2 * p)];
                T.neck = [-0.04, -0.08 * k * sin(p), 0];
                T.head = [0.02 * cos(2 * p), 0, 0];
                hipsOff[0] = -0.012 * k * cos(p);               // lateral weight shift
            } else if (mode === 'idle') {
                const br = sin(t * 1.6);
                T.chest = [0.015 * br, 0, 0];
                T.spine = [0.01, 0.03 * sin(t * 0.35), 0];
                T.upperArm_L = [0.02 * br, 0, -0.10]; T.upperArm_R = [0.02 * br, 0, 0.10];
                T.foreArm_L = [-0.12, 0, 0]; T.foreArm_R = [-0.12, 0, 0];
                T.hips = [0, 0, 0.02 * sin(t * 0.5)];
                T.thigh_L = [0, 0, -0.02 * sin(t * 0.5)]; T.thigh_R = [0, 0, -0.02 * sin(t * 0.5)];
                T.head = [0.03 * sin(t * 0.4), 0.18 * sin(t * 0.27), 0.03 * sin(t * 0.33)];
                hipsOff[0] = 0.01 * sin(t * 0.5);
            } else if (mode === 'talk') {
                const g = sin(t * 2.4), g2 = sin(t * 1.3 + 1);
                T.spine = [0.03, 0.06 * g2, 0];
                T.chest = [0.02 * sin(t * 1.6), 0.04 * g2, 0];
                T.head = [0.06 * sin(t * 3.1) * k, 0.12 * sin(t * 0.9), 0.05 * sin(t * 1.7)];
                T.neck = [0.03 * sin(t * 2.2), 0, 0];
                T.upperArm_R = [-0.35 - 0.12 * g * k, 0, 0.18];
                T.foreArm_R = [-(1.05 + 0.25 * g * k), 0.3, 0];
                T.hand_R = [-0.2, 0.3 * sin(t * 2.4 + 0.5), 0];
                T.upperArm_L = [-0.15 - 0.08 * g2 * k, 0, -0.12];
                T.foreArm_L = [-(0.55 + 0.2 * g2 * k), -0.2, 0];
                T.hand_L = [-0.1, -0.2 * g2, 0];
            }
            // 'lay' (rest pose) keeps the bind pose
            return { T, hipsOff };
        }

        // native-space ankle position of a leg for given thigh/knee pitch
        function ankleOffset(leg, a1, a2) {
            const rot = (v, a) => [v[1] * Math.cos(a) - v[2] * Math.sin(a), v[1] * Math.sin(a) + v[2] * Math.cos(a)];
            const p1 = rot(leg.v1, a1), p2 = rot(leg.v2, a1 + a2);
            return { y: p1[0] + p2[0], z: p1[1] + p2[1] };
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            time += dt * state.speed;
            const k = state.limbIntensity;

            if (rig) {
                if (state.mode === 'walk') walkPhase += dt * Math.PI * 2 * 0.95 * state.speed;
                const { T, hipsOff } = poseTargets(state.mode, k, walkPhase, time);
                const blend = 1 - Math.exp(-dt * 12);
                for (const name of BONE_NAMES) {
                    const bone = rig.bones[name], tg = T[name];
                    bone.rotation.x += (tg[0] - bone.rotation.x) * blend;
                    bone.rotation.y += (tg[1] - bone.rotation.y) * blend;
                    bone.rotation.z += (tg[2] - bone.rotation.z) * blend;
                }

                // Keep the planted foot on the floor: drop the hips by however much the legs are bent
                const B = rig.bones;
                const rest = ankleOffset(rig.legs.L, 0, 0).y;
                let stance = null, lowest = Infinity;
                for (const s of ['L', 'R']) {
                    const a = ankleOffset(rig.legs[s], B['thigh_' + s].rotation.x, B['shin_' + s].rotation.x);
                    rig.legs[s].cur = a;
                    if (a.y < lowest) { lowest = a.y; stance = s; }
                }
                const hips = B.hips, r0 = rig.rest.hips;
                hips.position.set(
                    r0.x + hipsOff[0] * rig.s,
                    r0.y + (rest - lowest) * rig.s,
                    r0.z
                );

                // Treadmill: ground moves exactly with the planted foot, so feet never slide
                if (state.mode === 'walk') {
                    const leg = rig.legs[stance];
                    const prev = leg.prevZ;
                    if (prev !== null) {
                        const dz = (leg.cur.z - prev) * rig.s * rig.scale;
                        if (dz < 0) rig.groundSpeed += (dz / Math.max(dt, 1e-4) - rig.groundSpeed) * 0.25;
                    }
                } else {
                    rig.groundSpeed *= 0.9;
                }
                rig.legs.L.prevZ = rig.legs.L.cur.z; rig.legs.R.prevZ = rig.legs.R.cur.z;
                groundOffset += rig.groundSpeed * dt;
                gridHelper.position.z = ((groundOffset % GRID_CELL) + GRID_CELL) % GRID_CELL;
            } else if (currentModel) {
                // placeholder avatar: simple sway
                const a = time * 3.5;
                if (state.mode === 'walk') currentModel.rotation.set(0, Math.sin(a) * 0.08 * k, 0);
                else if (state.mode === 'talk') currentModel.rotation.set(0, Math.sin(a * 0.8) * 0.15, 0);
                else if (state.mode === 'idle') currentModel.rotation.set(0, Math.sin(a * 0.3) * 0.05, 0);
                else currentModel.rotation.set(0, 0, 0);
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
